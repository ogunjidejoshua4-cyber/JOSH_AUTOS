<!DOCTYPE html>
<html>

<head>
    <title>Admin Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #0f172a;
            --card: #1e293b;
            --text-light: #e2e8f0;
            --input-bg: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: var(--input-bg);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            background: #374151;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #f87171;
        }

        .inpcontaner {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            width: 100%;
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: var(--input-bg);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .password-box input:focus {
            border-color: var(--primary);
            background: #374151;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
            color: #94a3b8;
        }

        .toggle:hover {
            opacity: 1;
            color: var(--text-light);
        }

        @media (max-width: 400px) {
            body {
                /* padding: 20px; */
                width: 100%;
            }

            .container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Admin Signup</h2>

        <div class="inpcontaner">

            <input type="text" id="firstName" placeholder="First Name">
            <input type="text" id="lastName" placeholder="Last Name">
            <input type="email" id="email" placeholder="Gmail">
            <div class="password-box">
                <input type="password" id="password" placeholder="Password">
                <span class="toggle" onclick="togglePassword()">👁️</span>
            </div>
            <input type="number" id="pin" placeholder="Admin PIN">

        </div>

        <button onclick="signup()">Sign Up</button>

        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA75tynwYg6ROH8AOjZ5LPsFUk5Ik9VyA0",
            authDomain: "lakancarproject.firebaseapp.com",
            projectId: "lakancarproject",
            storageBucket: "lakancarproject.firebasestorage.app",
            messagingSenderId: "911776744550",
            appId: "1:911776744550:web:5ae000c99ed2f884a559a7"
        };

        // 🔥 Initialize Firebase FIRST
        firebase.initializeApp(firebaseConfig);

        // ✅ Then create db
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function signup() {
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const userPin = document.getElementById("pin").value.trim();
            const message = document.getElementById("message");

            try {
                const doc = await db.collection("adminConfig").doc("secret").get();
                if (!firstName || !lastName || !email || !password || !userPin) {
                    message.innerText = "Please fill all fields";
                    return;
                }

                if (!doc.exists) {
                    message.innerText = "PIN not found!";
                    return;
                }

                const realPin = String(doc.data().pin).replace(/"/g, '').trim();

                if (userPin !== realPin) {
                    message.innerText = "Wrong Admin PIN!";
                    swal.fire({
                        icon: 'error',
                        title: 'Invalid PIN',
                        background: '#0d0d0d',
                        text: 'The admin PIN you entered is incorrect.',
                        buttons: {
                            confirm: {
                                text: 'Try Again',
                                value: true,
                                visible: true,
                                className: 'btn btn-primary',
                                closeModal: true
                            }
                        }
                    });
                    return;
                }

                // ✅ Create user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);

                // 💾 Save admin data
                await db.collection("admins").doc(userCredential.user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    password: password,
                    email: email,
                    role: "admin"
                });

                // message.innerText = "Admin account created!";
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: 'Admin account created successfully.',
                });

                window.location.href = "./Admin.html";


                document.getElementById("firstName").value = "";
                document.getElementById("lastName").value = "";
                document.getElementById("email").value = "";
                document.getElementById("pin").value = "";
                document.getElementById("password").value = "";


            } catch (error) {
                // message.innerText = error.message;
                if (error.code === "auth/email-already-in-use") {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'User already exists!',
                    });
                }

            }
        }
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eye = document.querySelector(".toggle");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eye.textContent = "🙈";
            } else {
                passwordInput.type = "password";
                eye.textContent = "👁️";
            }
        }

    </script>

</body>

</html>
