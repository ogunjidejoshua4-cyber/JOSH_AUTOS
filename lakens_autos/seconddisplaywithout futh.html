<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div id="carsContainer" class="vehicles-grid"></div>




  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA75tynwYg6ROH8AOjZ5LPsFUk5Ik9VyA0",
    authDomain: "lakancarproject.firebaseapp.com",
    projectId: "lakancarproject",
    storageBucket: "lakancarproject.firebasestorage.app",
    messagingSenderId: "911776744550",
    appId: "1:911776744550:web:5ae000c99ed2f884a559a7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const carsContainer = document.getElementById("carsContainer");

// ✅ Move this OUTSIDE
function viewCar(id) {
    window.location.href = `details.html?id=${id}`;
}

async function loadCars() {
    try {
        const querySnapshot = await getDocs(collection(db, "cars"));

        carsContainer.innerHTML = "";

        if (querySnapshot.empty) {
            carsContainer.innerHTML = "<h2>No cars found 🚗</h2>";
            return;
        }

        querySnapshot.forEach((doc) => {
            const car = doc.data();

            const carCard = document.createElement("div"); // ✅ FIXED
            carCard.classList.add("car-card");

            carCard.innerHTML = `
                <img src="${car.image || 'https://via.placeholder.com/300'}" 
                     style="width:100%; height:200px; object-fit:cover;">
                <h3>${car.name || "No name"}</h3>
                <p><strong>Brand:</strong> ${car.brand || "N/A"}</p>
                <p><strong>Price:</strong> ₦${car.price || "0"}</p>
                <p><strong>Features:</strong> ${car.features ? car.features.join(", ") : "None"}</p>
                <button onclick="viewCar('${doc.id}')">View Details</button>
            `;

            carsContainer.appendChild(carCard);
        });

    } catch (error) {
        console.error("🔥 Firestore Error:", error);
    }
}

loadCars();
</script>
</body>

</html>
