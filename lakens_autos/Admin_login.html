<!DOCTYPE html>
<html>

<head>
  <title>Admin Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #0f172a;
      --card: #1e293b;
      --text-light: #e2e8f0;
      --input-bg: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--secondary);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--input-bg);
      color: white;
      outline: none;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    input:focus {
      border-color: var(--primary);
      background: #374151;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    input::placeholder {
      color: #94a3b8;
      font-weight: 300;
    }

    .password-box {
      width: 100%;
      position: relative;
      margin-bottom: 12px;
    }

    .password-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--input-bg);
      color: white;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .password-box input:focus {
      border-color: var(--primary);
      background: #374151;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      opacity: 0.7;
      color: #94a3b8;
    }

    .toggle:hover {
      opacity: 1;
      color: var(--text-light);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Gmail">
    <div class="password-box">
      <input type="password" id="password" placeholder="Password">
      <span class="toggle" onclick="togglePassword()">👁️</span>
    </div>


    <button onclick="login()">Login</button>

     <p>Don't have an account? <a href="Admin_Signup.html">Sign up</a></p>

    <p id="message"></p>
  </div>

  <!-- Firebase (IMPORTANT: compat version) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA75tynwYg6ROH8AOjZ5LPsFUk5Ik9VyA0",
      authDomain: "lakancarproject.firebaseapp.com",
      projectId: "lakancarproject",
      storageBucket: "lakancarproject.firebasestorage.app",
      messagingSenderId: "911776744550",
      appId: "1:911776744550:web:5ae000c99ed2f884a559a7"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      // Clear message
      message.innerText = "";

      // Basic validation
      if (!email || !password) {
        message.innerText = "Please fill all fields";
        return;
      }

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);

        // 🔍 Check if user is admin
        const doc = await db.collection("admins").doc(userCredential.user.uid).get();

        if (!doc.exists) {
          message.innerText = "Access denied (not admin)";
          await auth.signOut();
          return;
        }

        message.style.color = "lightgreen";
        message.innerText = "Login successful!";

        window.location.href = "Admin.html";

        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

        // 👉 Redirect after login
        // window.location.href = "dashboard.html";

      } catch (error) {
        // Clean error messages (no ugly Firebase errors)
        message.style.color = "#f87171";

        if (error.code === "auth/user-not-found") {
          message.innerText = "User not found";
        } else if (error.code === "auth/wrong-password") {
          message.innerText = "Wrong password";
        } else if (error.code === "auth/invalid-email") {
          message.innerText = "Invalid email";
        } else {
          message.innerText = "Login failed";
        }
      }
    }
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const eye = document.querySelector(".toggle");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eye.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        eye.textContent = "👁️";
      }
    }
  </script>

</body>

</html>
