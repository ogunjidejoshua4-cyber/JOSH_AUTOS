<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details - LuxAuto</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            -primary: #1a1a1a;
            --secondary: #0d0d0d;
            --accent: #c9a962;
            --accent-hover: #b8944f;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, rgba(255, 107, 53, 0.08), transparent 30%),
                linear-gradient(180deg, #08101e 0%, #05070c 100%);
            color: var(--text-light);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1500;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(30, 30, 30, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo i {
            font-size: 1.8rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo:hover i {
            transform: rotate(-10deg) scale(1.1);
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 3rem;
            margin: 0;
            padding: 0;
            flex: 1;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
            display: inline-block;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
            border-radius: 1px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }

        .nav-links a:hover::before,
        .nav-links a.active::before {
            width: 100%;
        }

        .nav-cta {
            display: inline-block;
            padding: 0.7rem 2rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 2px solid var(--accent);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .nav-cta:hover {
            background: transparent;
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .mobile-menu-btn span {
            width: 25px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .breadcrumb {
            margin-top: 80px;
            padding: 1rem 5%;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        .breadcrumb-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        .breadcrumb span {
            color: var(--text-muted);
        }

        .breadcrumb span:last-child {
            color: var(--accent);
        }

        .detail-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 5%;
            min-height: calc(100vh - 300px);
        }

        .loading-state,
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .spinner-large {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .detail-content {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 3rem;
        }

        .gallery-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .main-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            aspect-ratio: 16/10;
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .main-image:hover img {
            transform: scale(1.05);
        }

        .image-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--accent);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            background: var(--accent);
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .thumbnail {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            aspect-ratio: 16/10;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail:hover,
        .thumbnail.active {
            border-color: var(--accent);
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .title-block {
            flex: 1;
        }

        .detail-brand {
            display: inline-block;
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .detail-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .detail-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-size: 0.95rem;
        }

        .detail-rating i {
            color: #fbbf24;
        }

        .detail-rating span {
            color: var(--text-muted);
            margin-left: 0.5rem;
        }

        .price-block {
            text-align: right;
        }

        .detail-price {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .detail-time {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .price-note {
            font-size: 0.85rem;
            color: var(--success);
            margin-top: 0.5rem;
        }

        .quick-specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .spec-box {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .spec-box:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .spec-box i {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }

        .spec-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .spec-value {
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .description-section h2,
        .features-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }

        .description-section p {
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--glass);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .feature-item i {
            color: var(--success);
            font-size: 1.1rem;
        }

        .action-section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
        }

        .price-summary {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-light);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
        }

        .btn-primary {
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 98, 0.3);
        }

        .btn-secondary {
            padding: 1rem;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-light);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .contact-section {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(201, 169, 98, 0.1) 0%, transparent 100%);
            border-radius: 16px;
            border: 1px solid rgba(201, 169, 98, 0.2);
        }

        .contact-section h3 {
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .contact-options {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-btn {
            padding: 0.75rem 1.5rem;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .contact-btn:hover {
            border-color: var(--accent);
            background: rgba(201, 169, 98, 0.1);
        }

        .contact-btn.whatsapp {
            background: #25d366;
            color: white;
            border-color: #25d366;
        }

        .contact-btn.whatsapp:hover {
            background: #128c7e;
        }

        .error-state i {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1rem;
        }

        .error-state h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .error-state p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .detail-footer {
            background: var(--primary);
            padding: 2rem 5%;
            border-top: 1px solid var(--border);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        @media (max-width: 1024px) {
            .detail-content {
                grid-template-columns: 1fr;
            }

            .quick-specs {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .detail-name {
                font-size: 2rem;
            }

            .detail-price {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .breadcrumb {
                margin-top: 70px;
            }

            .detail-header {
                flex-direction: column;
                gap: 1.5rem;
            }

            .price-block {
                text-align: left;
            }

            .quick-specs {
                grid-template-columns: repeat(2, 1fr);
            }

            .spec-box {
                padding: 1rem;
            }

            .thumbnail-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .detail-name {
                font-size: 1.75rem;
            }

            .detail-price {
                font-size: 2rem;
            }
        }
    </style>
</head>

    <div class="breadcrumb">
        <div class="breadcrumb-content">
            <a href="../index.html"><i class="fas fa-home"></i> Home</a>
            <span>/</span>
            <a href="./cardisplay.html">Inventory</a>
            <span>/</span>
            <span id="breadcrumbCarName">Car Details</span>
        </div>
    </div>

    <main class="detail-container">
        <div class="loading-state" id="loadingState">
            <div class="spinner-large"></div>
            <p>Loading car details...</p>
        </div>

        <div class="detail-content" id="detailContent" style="display: none;"></div>

        <div class="error-state" id="errorState" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <h2>Car Not Found</h2>
            <p>Sorry, we couldn't find the car you're looking for.</p>
            <a href="index.html" class="btn-primary">Back to Inventory</a>
        </div>
    </main>

    <footer class="detail-footer">
        <div class="footer-content">
            <p>&copy; 2026 LuxAuto. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_KEY",
            authDomain: "YOUR_DOMAIN",
            projectId: "lakancarproject",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const carId = localStorage.getItem("selectedCarId");
        const loadingState = document.getElementById("loadingState");
        const detailContent = document.getElementById("detailContent");
        const errorState = document.getElementById("errorState");

        if (!carId) {
            showError('No car selected', 'Please pick a car from the inventory first.');
        } else {
            loadCar();
        }

        async function loadCar() {
            try {
                const docRef = doc(db, "cars", carId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    showError('Car not found', 'Sorry, we could not find the requested car.');
                    return;
                }

                renderCar(docSnap.data());
            } catch (error) {
                console.error(error);
                showError('Load failed', 'Unable to load car details at this time.');
            }
        }

        function showError(title, message) {
            loadingState.style.display = 'none';
            detailContent.style.display = 'none';
            errorState.style.display = 'flex';
            errorState.querySelector('h2').textContent = title;
            errorState.querySelector('p').textContent = message;
        }

        function formatPrice(value) {
            if (typeof value === 'number') {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                }).format(value);
            }
            if (typeof value === 'string' && value.trim() !== '') {
                return value;
            }
            return 'N/A';
        }

        function extractNumericPrice(value) {
            if (typeof value === 'number') return value;
            if (!value) return 0;

            const str = value.toString().toLowerCase().trim();
            const match = str.match(/(\d+\.?\d*)\s*([kmb])?/i);

            if (!match) return 0;

            let num = parseFloat(match[1]);
            const suffix = match[2];

            if (suffix) {
                const multipliers = { 'k': 1000, 'm': 1000000, 'b': 1000000000 };
                num *= multipliers[suffix] || 1;
            }

            return num;
        }

        function renderCar(car) {
            const images = Array.isArray(car.image) && car.image.length > 0
                ? car.image
                : ['https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=1200&q=80'];

            const priceText = formatPrice(car.price ?? car.basePrice ?? 0);
            const priceUnit = car.priceUnit || '';
            const detailYear = car.Year || car.year || '2026';
            const transmission = car.Transmission || car.transmission || 'Automatic';
            const tankCapacity = car.tankCapacity || car.FuelCapacity || '65';
            const airConditioning = car.airConditioning ?? car.ac ?? true;
            const seats = car.seats || 5;
            const luggage = car.luggage || '3 Bags';
            const description = car.description || car.details || 'Experience luxury and performance with this exceptional vehicle, perfect for both city driving and long journeys.';
            const features = Array.isArray(car.features) ? car.features : ['GPS Navigation', 'Bluetooth', 'Backup Camera', 'Keyless Entry', 'Cruise Control', 'Heated Seats', 'Sunroof', 'Parking Sensors'];
            const insurance = car.insurance ?? 2000;
            const serviceFee = car.serviceFee ?? 700;
            const priceNumeric = extractNumericPrice(car.price ?? car.basePrice ?? 0);
            const totalValue = formatPrice(priceNumeric + insurance + serviceFee);

            loadingState.style.display = 'none';
            errorState.style.display = 'none';
            detailContent.style.display = 'grid';

            detailContent.innerHTML = `
                <section class="gallery-section">
                    <div class="main-image">
                        <img id="mainCarImage" src="${images[0]}" alt="Car Image">
                        <div class="image-badge">Featured</div>
                        <button class="fullscreen-btn" type="button" onclick="toggleFullscreen()">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                    <div class="thumbnail-grid" id="thumbnailGrid">
                        ${images.map((img, index) => `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeImage('${img}', this)">
                                <img src="${img}" alt="Thumbnail ${index + 1}">
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="info-section">
                    <div class="detail-header">
                        <div class="title-block">
                            <span class="detail-brand">${car.brand || 'Unknown Brand'}</span>
                            <h1 class="detail-name">${car.name || car.model || 'Premium Vehicle'}</h1>
                            <div class="detail-rating">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star-half-alt"></i>
                                <span>4.8 (124 reviews)</span>
                            </div>
                        </div>
                        <div class="price-block">
                            <div class="detail-price">${priceText}</div>
                            <div class="detail-time">${priceUnit}</div>
                            <div class="price-note">Taxes included</div>
                        </div>
                    </div>

                    <div class="quick-specs">
                        <div class="spec-box">
                            <i class="fas fa-cog"></i>
                            <span class="spec-label">Transmission</span>
                            <span class="spec-value">${transmission}</span>
                        </div>
                        <div class="spec-box">
                            <i class="fas fa-gas-pump"></i>
                            <span class="spec-label">Tank Capacity</span>
                            <span class="spec-value">${tankCapacity} L</span>
                        </div>
                        <div class="spec-box">
                            <i class="fas fa-snowflake"></i>
                            <span class="spec-label">Air Conditioning</span>
                            <span class="spec-value">${airConditioning ? 'Yes' : 'No'}</span>
                        </div>
                        <div class="spec-box">
                            <i class="fas fa-users"></i>
                            <span class="spec-label">Seats</span>
                            <span class="spec-value">${seats}</span>
                        </div>
                        <div class="spec-box">
                            <i class="fas fa-suitcase"></i>
                            <span class="spec-label">Luggage</span>
                            <span class="spec-value">${luggage}</span>
                        </div>
                        <div class="spec-box">
                            <i class="fas fa-calendar"></i>
                            <span class="spec-label">Year</span>
                            <span class="spec-value">${detailYear}</span>
                        </div>
                    </div>

                    <div class="description-section">
                        <h2>Description</h2>
                        <p>${description}</p>
                    </div>

                    <div class="features-section">
                        <h2>Features</h2>
                        <div class="features-grid">
                            ${features.map(feature => `<div class="feature-item"><i class="fas fa-check"></i>${feature}</div>`).join('')}
                        </div>
                    </div>

                    <div class="action-section">
                        <div class="price-summary">
                            <div class="summary-row">
                                <span>Base Price</span>
                                <span>${priceText}</span>
                            </div>
                            <div class="summary-row">
                                <span>Insurance</span>
                                <span>${formatPrice(insurance)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Service Fee</span>
                                <span>${formatPrice(serviceFee)}</span>
                            </div>
                            <div class="summary-row total">
                                <span>Total</span>
                                <span>${totalValue}</span>
                            </div>
                        </div>

                        <div class="contact-section">
                            <h3>Contact Seller</h3>
                            <div class="contact-options">
                                <a href="https://wa.me/2349045860541?text=Hello%20I%20am%20interested%20in%20your%20car" class="contact-btn whatsapp">
                                    <i class="fab fa-whatsapp"></i>
                                    WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            document.getElementById('breadcrumbCarName').textContent = car.name || 'Car Details';
        }

        window.changeImage = (img, thumbElement) => {
            document.getElementById('mainCarImage').src = img;
            document.querySelectorAll('.thumbnail').forEach(tile => tile.classList.remove('active'));
            if (thumbElement) thumbElement.classList.add('active');
        };

        window.toggleFullscreen = () => {
            const imageSection = document.querySelector('.main-image');
            if (!document.fullscreenElement) {
                imageSection.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        };
    </script>
</body>

</html>
