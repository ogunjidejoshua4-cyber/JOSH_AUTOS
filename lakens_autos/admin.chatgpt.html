<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Add Car</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: bold;
        margin-bottom: 5px;
    }

    input, select, textarea {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 14px;
    }

    textarea {
        resize: none;
        height: 80px;
    }

    .full-width {
        grid-column: span 2;
    }

    button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        border: none;
        background: #007bff;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #0056b3;
    }

    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h2>Add New Car 🚗</h2>

    <form id="carForm">

        <div class="form-grid">

            <div class="form-group">
                <label>Car Name</label>
                <input type="text" placeholder="e.g BMW M4" required>
            </div>

            <div class="form-group">
                <label>Brand</label>
                <select required>
                    <option>BMW</option>
                    <option>BENZ</option>
                    <option>Ford</option>
                    <option>Audi</option>
                    <option>Tesla</option>
                    <option>TOYOTA</option>
                    <option>HONDA</option>
                    <option>Lexus</option>
                    <option>NISSAN</option>
                    <option>Cadillac</option>
                    <option>Porsche</option>
                    <option>Hyundai</option>
                    <option>PORSCHE</option>
                    <option>Chevrolet</option>
                    <option>Volkswagen</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" placeholder="e.g 50000000" required>
            </div>

            <div class="form-group">
                <label>Year</label>
                <input type="number" placeholder="2024">
            </div>

            <div class="form-group">
                <label>Transmission</label>
                <select>
                    <option>Automatic</option>
                    <option>Manual</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fuel Type</label>
                <select>
                    <option>Petrol</option>
                    <option>Diesel</option>
                    <option>Electric</option>
                    <option>Hybrid</option>
                </select>
            </div>

            <div class="form-group">
                <label>Seats</label>
                <input type="number" placeholder="e.g 5">
            </div>

            <div class="form-group">
                <label>Color</label>
                <input type="text" placeholder="e.g Black">
            </div>

            <div class="form-group">
                <label>Car Type</label>
                <select>
                    <option>SUV</option>
                    <option>Sedan</option>
                    <option>Coupe</option>
                    <option>Truck</option>
                    <option>Hatchback</option>
                </select>
            </div>

            <div class="form-group">
                <label>Availability</label>
                <select>
                    <option>Available</option>
                    <option>Booked</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Image URL</label>
                <input type="text" placeholder="Paste image link here">
            </div>

            <div class="form-group full-width">
                <label>Description</label>
                <textarea placeholder="Enter car description..."></textarea>
            </div>

        </div>

        <button type="submit">Add Car</button>

    </form>
</div>

</body>
</html>
