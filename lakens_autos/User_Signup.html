<!DOCTYPE html>
<html>

<head>
  <title>User Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #0f172a;
      --card: #1e293b;
      --text-light: #e2e8f0;
      --input-bg: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--secondary);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--input-bg);
      color: white;
      outline: none;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    input:focus {
      border-color: var(--primary);
      background: #374151;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    input::placeholder {
      color: #94a3b8;
      font-weight: 300;
    }

    .password-box {
      width: 100%;
      position: relative;
    }

    .password-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--input-bg);
      color: white;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .password-box input:focus {
      border-color: var(--primary);
      background: #374151;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      opacity: 0.7;
      color: #94a3b8;
    }

    .toggle:hover {
      opacity: 1;
      color: var(--text-light);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 12px;
    }

    button:hover {
      background: #4338ca;
    }

    #msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .inpbox {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2 style="display: flex; justify-content: center;">User Signup</h2>

    <div class="inpbox">
      <input type="text" id="firstName" placeholder="First Name">
      <input type="text" id="lastName" placeholder="Last Name">
      <input type="email" id="email" placeholder="Gmail">
      <div class="password-box">
        <input type="password" id="password" placeholder="Password">
        <span class="toggle" onclick="togglePassword()">👁️</span>
      </div>


    </div>
    <button onclick="signup()">Sign Up</button>
    <p id="msg"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA75tynwYg6ROH8AOjZ5LPsFUk5Ik9VyA0",
      authDomain: "lakancarproject.firebaseapp.com",
      projectId: "lakancarproject",
      storageBucket: "lakancarproject.firebasestorage.app",
      messagingSenderId: "911776744550",
      appId: "1:911776744550:web:5ae000c99ed2f884a559a7"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function validateEmail(email) {
      return /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email);
    }

    function validatePassword(password) {
      // min 6 chars, 1 number
      return /^(?=.*\d).{6,}$/.test(password);
    }

    async function signup() {
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.style.color = "red";

      // ✅ Regex checks
      if (!validateEmail(email)) {
        msg.innerText = "Use a valid Gmail address";
        return;
      }

      if (!validatePassword(password)) {
        msg.innerText = "Password must be 6+ chars & include a number";
        return;
      }

      try {
        const user = await auth.createUserWithEmailAndPassword(email, password);

        await db.collection("users").doc(user.user.uid).set({
          firstName,
          lastName,
          password, // Storing plaintext password is NOT recommended in production!
          email,
          role: "user"
        });

        msg.style.color = "lightgreen";
        msg.innerText = "Signup successful!";

        window.location.href = "../index.html";


        document.getElementById("firstName").value = "";
        document.getElementById("lastName").value = "";
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

      } catch (e) {
        msg.innerText = "Signup failed";
      }
    }
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const eye = document.querySelector(".toggle");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eye.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        eye.textContent = "👁️";
      }
    }
  </script>

</body>

</html>
